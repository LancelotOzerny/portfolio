<div class="widget-chart">
	<p class="widget-chart__title" hidden></p>
	<div class="widget-chart__body">
		<span class="widget-chart__ylabel" hidden></span>
		<div class="widget-chart__canvas">
			<svg class="widget-chart__svg" viewBox="0 0 640 360" role="img" aria-label="Диаграмма"></svg>
		</div>
	</div>
	<p class="widget-chart__xlabel" hidden></p>
	<p class="widget-chart__empty" hidden>Добавьте значения X и Y, чтобы построить диаграмму.</p>
</div>
